<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
<title>Solar System Remote</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; min-height: 100%;
    background: #0a0e1c; color: #e8f1ff;
    font-family: system-ui, sans-serif;
  }
  body { padding: 16px 16px 40px; }
  h1 { font-size: 18px; margin: 4px 0 14px; text-align: center; }
  #status { text-align: center; font-size: 12px; opacity: 0.6; margin-bottom: 14px; }
  #status.connected { color: #7fe0a0; opacity: 1; }
  section {
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 14px;
    padding: 12px;
    margin-bottom: 12px;
  }
  h2 { font-size: 13px; margin: 0 0 8px; opacity: 0.8; text-transform: uppercase; letter-spacing: 0.04em; }
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .grid--2 { grid-template-columns: repeat(2, 1fr); }
  button {
    background: rgba(255,255,255,0.09);
    border: 1px solid rgba(255,255,255,0.2);
    color: #e8f1ff;
    border-radius: 10px;
    padding: 14px 6px;
    font-size: 14px;
    font-weight: 700;
    font-family: inherit;
    cursor: pointer;
  }
  button:active { background: rgba(255,255,255,0.25); }
  button.wide { grid-column: 1 / -1; padding: 16px; font-size: 16px; }
  input[type="range"] { width: 100%; }
  .speed-label { text-align: center; font-size: 13px; opacity: 0.8; margin-top: 4px; }
  .hint { font-size: 11px; opacity: 0.6; margin: 0 0 8px; }
  button.active { background: rgba(127,224,160,0.28); border-color: rgba(127,224,160,0.6); }
</style>
</head>
<body>
  <h1>🔭 Solar System Remote</h1>
  <div id="status">connecting…</div>

  <section>
    <h2>Playback</h2>
    <div class="grid grid--2">
      <button data-send='{"action":"playpause"}'>⏯ Play / Pause</button>
      <button data-send='{"action":"scale"}'>📐 Storybook / True</button>
    </div>
    <input type="range" min="0" max="5" step="1" value="3" id="speed" />
    <div class="speed-label" id="speed-label">1 day/sec</div>
  </section>

  <section>
    <h2>View</h2>
    <div class="grid grid--2">
      <button data-send='{"action":"labels"}'>🏷 Labels</button>
      <button data-send='{"action":"orbits"}'>⭕ Orbits</button>
      <button class="wide" data-send='{"action":"exitFocus"}'>← Back to Solar System</button>
      <button class="wide" id="reload-btn">🔄 Reload Display</button>
    </div>
    <p class="hint" style="margin-top:8px">If the display ever looks frozen or broken, tap Reload — it won't lose anything, the show just restarts.</p>
  </section>

  <section>
    <h2>Focus on a Planet</h2>
    <p class="hint">During a quiz, tapping a planet here answers it instead of focusing.</p>
    <div class="grid" id="planet-grid"></div>
  </section>

  <section>
    <h2>Rotate View</h2>
    <div class="grid grid--2">
      <button id="rotate-left">◀ Rotate</button>
      <button id="rotate-right">Rotate ▶</button>
      <button id="rotate-up">▲ Tilt Up</button>
      <button id="rotate-down">▼ Tilt Down</button>
    </div>
    <button class="wide" id="autospin" style="margin-top:8px">🔄 Auto-Spin: Off</button>
  </section>

  <section>
    <h2>Explore</h2>
    <div class="grid grid--2">
      <button data-send='{"action":"compare"}'>📏 Compare Sizes</button>
      <button data-send='{"action":"tour"}'>🎬 Tour</button>
      <button data-send='{"action":"season","value":"mar"}'>🌱 Spring</button>
      <button data-send='{"action":"season","value":"jun"}'>☀️ Summer</button>
      <button data-send='{"action":"season","value":"sep"}'>🍂 Fall</button>
      <button data-send='{"action":"season","value":"dec"}'>❄️ Winter</button>
      <button data-send='{"action":"nightsky"}'>🌌 Night Sky</button>
      <button data-send='{"action":"quiz"}'>🎯 Quiz</button>
      <button id="sound-btn" data-send='{"action":"sound"}'>🔊 Sound: …</button>
      <button id="readaloud-btn" data-send='{"action":"readaloud"}'>🗣️ Read Aloud: …</button>
    </div>
  </section>

<script>
  // Kept in sync by hand with src/config.js SPEED_PRESETS.
  var SPEED_LABELS = ["Real-time", "1 min/sec", "1 hour/sec", "1 day/sec", "1 week/sec", "1 month/sec"];
  var PLANETS = ["Mercury", "Venus", "Earth", "Mars", "Jupiter", "Saturn", "Uranus", "Neptune", "Moon", "Sun"];

  var grid = document.getElementById("planet-grid");
  PLANETS.forEach(function (name) {
    var btn = document.createElement("button");
    btn.textContent = name;
    btn.addEventListener("click", function () { send({ action: "focus", value: name.toLowerCase() }); });
    grid.appendChild(btn);
  });

  var statusEl = document.getElementById("status");
  var ws = null;

  // The display is the source of truth for on/off state (it can change on
  // its own — e.g. sound auto-starts on the display's first tap, or a quiz
  // exit turns auto-spin back off) — so these buttons just render whatever
  // state message arrives, rather than guessing from their own click.
  var soundBtn = document.getElementById("sound-btn");
  var readAloudBtn = document.getElementById("readaloud-btn");

  function applyState(state) {
    if (typeof state.sound === "boolean") {
      soundBtn.textContent = "🔊 Sound: " + (state.sound ? "On" : "Off");
      soundBtn.classList.toggle("active", state.sound);
    }
    if (typeof state.readAloud === "boolean") {
      readAloudBtn.textContent = "🗣️ Read Aloud: " + (state.readAloud ? "On" : "Off");
      readAloudBtn.classList.toggle("active", state.readAloud);
    }
    if (typeof state.autoSpin === "boolean") {
      autoSpinBtn.textContent = "🔄 Auto-Spin: " + (state.autoSpin ? "On" : "Off");
      autoSpinBtn.classList.toggle("active", state.autoSpin);
    }
  }

  function connect() {
    var proto = location.protocol === "https:" ? "wss" : "ws";
    ws = new WebSocket(proto + "://" + location.host);
    ws.onopen = function () {
      statusEl.textContent = "connected";
      statusEl.className = "connected";
      send({ action: "requestState" });
    };
    ws.onclose = function () { statusEl.textContent = "reconnecting…"; statusEl.className = ""; setTimeout(connect, 2000); };
    ws.onerror = function () { ws.close(); };
    ws.onmessage = function (e) {
      try {
        var msg = JSON.parse(e.data);
        if (msg.type === "state") applyState(msg);
      } catch (err) { /* ignore malformed messages */ }
    };
  }
  connect();

  function send(payload) {
    if (ws && ws.readyState === 1) ws.send(JSON.stringify(payload));
  }

  document.querySelectorAll("[data-send]").forEach(function (btn) {
    btn.addEventListener("click", function () { send(JSON.parse(btn.getAttribute("data-send"))); });
  });

  // Hold-to-rotate: send a start on press, a stop on release (or if the
  // finger/pointer leaves the button), so it behaves like a joystick nudge.
  function wireHold(id, action, dir) {
    var btn = document.getElementById(id);
    var start = function (e) { e.preventDefault(); send({ action: action, value: dir }); };
    var stop = function () { send({ action: action, value: "stop" }); };
    btn.addEventListener("pointerdown", start);
    btn.addEventListener("pointerup", stop);
    btn.addEventListener("pointerleave", stop);
    btn.addEventListener("pointercancel", stop);
  }
  wireHold("rotate-left", "rotateH", "left");
  wireHold("rotate-right", "rotateH", "right");
  wireHold("rotate-up", "rotateV", "up");
  wireHold("rotate-down", "rotateV", "down");

  document.getElementById("reload-btn").addEventListener("click", function () {
    send({ action: "reload" });
  });

  var autoSpinBtn = document.getElementById("autospin");
  autoSpinBtn.addEventListener("click", function () { send({ action: "autospin" }); });

  var speedInput = document.getElementById("speed");
  var speedLabel = document.getElementById("speed-label");
  speedInput.addEventListener("input", function () {
    speedLabel.textContent = SPEED_LABELS[Number(speedInput.value)];
    send({ action: "speed", value: Number(speedInput.value) });
  });
</script>
</body>
</html>
